<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENYAS</title>
<meta name="description" content="Live sign language translator and sign language lessons in English, Filipino and Bikol.">
<meta name="theme-color" content="#0E5BD8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SENYAS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>:root{--bg:#F4F7FC;--card:#FFFFFF;--ink:#0B1630;--mut:#5B6880;--line:#DCE3EF;--pri:#0E5BD8;--pri2:#0A47AA;--on:#FFFFFF;--acc:#F2A900;--ok:#0E9F6E;--bad:#D93A3A;--soft:#E8F0FE;--glass:rgba(10,20,40,.55);--shadow:0 6px 24px rgba(16,32,64,.08);--r:18px;--fs:16px;--rail:84px;color-scheme:light}
:root[data-theme=dark]{--bg:#0B1220;--card:#131C2E;--ink:#E8EEF9;--mut:#9AA8C0;--line:#24314A;--pri:#5B9BFF;--pri2:#7FB0FF;--on:#06101F;--soft:#18284A;--shadow:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--card:#131C2E;--ink:#E8EEF9;--mut:#9AA8C0;--line:#24314A;--pri:#5B9BFF;--pri2:#7FB0FF;--on:#06101F;--soft:#18284A;--shadow:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root.hc{--ink:#000;--mut:#1a1a1a;--line:#000;--pri:#0033AA;--bg:#fff;--card:#fff}
:root.hc[data-theme=dark]{--ink:#fff;--mut:#eee;--line:#fff;--pri:#8EC1FF;--bg:#000;--card:#000}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}h2{font-size:1.1rem;margin:1.4rem 0 .6rem}h3{font-size:1rem;margin:0}
.muted{color:var(--mut)}.small{font-size:.85rem}[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:10px}
#app{display:flex;min-height:100dvh}
html,body{overflow-x:hidden}.tgrid>*,.pane{min-width:0}
main{flex:1;min-width:0;padding:calc(env(safe-area-inset-top) + 12px) max(16px,env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.view{max-width:1400px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
/* nav */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;color:var(--mut);font-size:.72rem;font-weight:600;min-height:52px;justify-content:center}
.tab.on{color:var(--pri);background:var(--soft)}
.rail{display:none}
.brand{display:flex;align-items:center;gap:8px;padding:8px 6px 18px;font-size:1.05rem}
.logo{width:38px;height:38px;flex:none;display:block}.logo svg{width:100%;height:100%;stroke:none}
/* controls */
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips.scroll::-webkit-scrollbar{display:none}
.chips button,.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.88rem;min-height:40px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:var(--on)}
.primary,.pill,.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:11px 18px;font-weight:700;min-height:46px}
.primary{background:var(--pri);color:var(--on)}.primary:active{transform:scale(.98)}
.pill{background:var(--soft);color:var(--pri);border-radius:999px;padding:8px 14px;min-height:40px;font-size:.9rem}
.ghost{background:transparent;border:1px solid var(--line)}
.big{font-size:1.1rem;padding:14px 24px;border-radius:16px}
.ib{width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink);background:var(--soft)}
.ib.glass{background:var(--glass);color:#fff;backdrop-filter:blur(8px)}
.ib.on{background:var(--pri);color:var(--on)}
.link{color:var(--pri);font-weight:600;min-height:40px;min-width:40px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center}
select{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:40px}
input[type=search],input[type=text],textarea{width:100%;background:transparent;border:0;outline:0;resize:none}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.knob{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch input:checked+.knob{background:var(--ok)}.switch input:checked+.knob::after{left:21px}
.switch input:focus-visible+.knob{outline:3px solid var(--acc);outline-offset:2px}
/* translate */
.tgrid{display:grid;gap:16px}
.pane.t2s,.pane.brl{display:none}
.tgrid.t2s .pane.s2t,.tgrid.brl .pane.s2t{display:none}.tgrid.t2s .pane.t2s,.tgrid.brl .pane.brl{display:block}
.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#bcam canvas{object-fit:contain}#bcam video{object-fit:contain}
.brlline{font-size:1.6rem;letter-spacing:.08em;line-height:1.3;word-break:break-all;color:var(--pri);min-height:1.3em;white-space:pre-wrap}
.chart{margin-top:12px;padding:12px 16px}.chart summary{font-weight:700;cursor:pointer}
.bchart{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:10px}
.bchart span{display:flex;flex-direction:column;align-items:center;background:var(--soft);border-radius:10px;padding:4px 0;font-weight:700}.bchart span i{font-style:normal;font-size:1.8rem;color:var(--pri);line-height:1.1}
.cam{position:relative;aspect-ratio:4/3;max-height:58dvh;width:100%;border-radius:var(--r);overflow:hidden;background:radial-gradient(circle at 50% 40%,#1d2a44,#0a1020);color:#fff}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam.mirror video,.cam.mirror canvas{transform:scaleX(-1)}
.camstart{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:20px}
.camstart .muted{color:#B9C6DE;max-width:32ch}
.status{position:absolute;left:12px;top:12px;background:var(--glass);padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:600}
.status:empty{display:none}
.camtools{position:absolute;right:10px;top:10px;display:flex;gap:8px;z-index:2}.cam:not(.live) .camtools{display:none}
.badge{position:absolute;left:12px;bottom:12px;min-width:86px;background:var(--glass);border-radius:16px;padding:8px 14px 10px;text-align:center;backdrop-filter:blur(8px)}
.badge b{display:block;font-size:2rem;line-height:1.1}
.badge i{display:block;height:5px;border-radius:5px;background:var(--acc);margin-top:6px;transition:width .15s}
.out{padding:14px}
.outhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.spell{min-height:1.6em;margin:10px 0 0;font:700 1.15rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.25em;color:var(--pri)}
.spell:not(:empty)::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--acc)}
@keyframes blink{50%{opacity:0}}
.caption{font-size:1.6rem;font-weight:700;min-height:2.2em;margin:4px 0 10px;word-wrap:break-word}
.caption .ph{font-size:1rem;font-weight:500;color:var(--mut)}
.caption .tok{display:inline-block;margin-right:.3em;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools .pill{margin-left:auto}
.stage{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--soft),var(--card))}
.avatar{display:block;width:100%;height:min(52dvh,460px)}
.nowsign{position:absolute;left:0;right:0;top:10px;text-align:center;font-weight:800;font-size:1.4rem;text-shadow:0 1px 0 var(--card)}
.stagectl{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;align-items:center}
.stagectl select{background:var(--glass);color:#fff;border:0}
.gloss .chip.on{background:var(--acc);border-color:var(--acc);color:#1a1300}
.ask{padding:10px 12px;margin-top:10px}
.askrow{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.ask .primary{min-height:44px}
#mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 25%,transparent)}}
.hist{margin-top:16px;padding:14px}
#history{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}
#history li{padding:8px 12px;border-radius:14px;background:var(--soft);max-width:85%}
#history li.sp{align-self:flex-end;background:color-mix(in srgb,var(--acc) 22%,var(--card))}
#history small{display:block;color:var(--mut);font-size:.72rem}
#history:empty::before{content:attr(data-empty);color:var(--mut);font-size:.9rem}
/* learn */
.stats{display:flex;gap:16px;padding:16px;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}.stat b{font-size:1.4rem}.stat span{color:var(--mut);font-size:.8rem}
.xpbar{flex:1;min-width:160px;height:10px;border-radius:10px;background:var(--soft);overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#7A3CFF);border-radius:10px}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badges span{font-size:1.3rem;filter:grayscale(1);opacity:.35}.badges span.got{filter:none;opacity:1}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.unit{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);min-height:118px;position:relative}
.unit .uic{font-size:1.6rem}.unit small{color:var(--mut)}
.unit .prog{position:absolute;right:12px;top:12px;width:38px;height:38px}
.unit.done{border-color:var(--ok)}
/* lesson / quiz */
.lesson{display:grid;gap:14px}
.lesson .avatar{height:min(42dvh,380px);border-radius:var(--r);background:linear-gradient(180deg,var(--soft),var(--card))}
.wordbig{font-size:2rem;font-weight:800;text-align:center}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio button{background:var(--soft);border-radius:14px;padding:10px 6px;text-align:center}
.trio small{display:block;color:var(--mut);font-size:.7rem;font-weight:700;letter-spacing:.06em}
.navrow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:700;min-height:56px}
.opt canvas{width:100%;height:120px;display:block}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.qbar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.qbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.celebrate{font-size:3rem;text-align:center;animation:pop .4s}
/* dictionary */
.search{display:flex;align-items:center;gap:10px;padding:10px 14px}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:6px 0 14px}
.letters button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 0 6px;font-weight:800}
.letters canvas{width:100%;height:64px;display:block}
.wlist,.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.witem{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.witem canvas{width:64px;height:64px;border-radius:12px;background:var(--soft);flex:none}
.witem b{display:block}.witem small{color:var(--mut)}
.live{display:inline-block;font-size:.65rem;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);margin-left:6px;vertical-align:middle}
.pitem{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.pitem .l{font-size:.7rem;font-weight:800;color:var(--mut);letter-spacing:.06em;margin-right:6px}
.pitem button[data-say]{min-height:40px;width:100%;padding:6px 0;display:block}
.pitem .acts{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
/* settings */
.sets{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start}
.group{padding:6px 16px}
.group h3{margin:12px 0 4px;color:var(--mut);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.group h3+.set{border-top:0}
.set>span{flex:1}.set small{display:block;color:var(--mut)}
.tones{display:flex;gap:8px}.tones button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}.tones button.on{border-color:var(--pri)}
input[type=range]{accent-color:var(--pri);width:140px;min-height:40px}
/* sheet & toast */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheetbox{position:relative;background:var(--card);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:22px max(18px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheetbox .close{position:absolute;right:12px;top:12px;z-index:2}
.sheetbox h2{margin-top:0;padding-right:44px}
.sheet.camsheet{align-items:flex-start;background:transparent;pointer-events:none}.sheet.camsheet .sheetbox{pointer-events:auto;border-radius:0 0 24px 24px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.policy h3{margin:1.1em 0 .3em}.policy p,.policy li{color:var(--ink);font-size:.95rem}
.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
.form input{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.takes{display:flex;gap:8px}.takes span{flex:1;height:10px;border-radius:10px;background:var(--soft)}.takes span.ok{background:var(--ok)}.takes span.rec{background:var(--bad);animation:blink .6s infinite}
.count{font-size:3rem;font-weight:900;text-align:center;color:var(--pri)}
/* tablet and up: side rail */
@media (min-width:720px){
  .bar{display:none}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh;width:var(--rail);flex:none;padding:calc(env(safe-area-inset-top) + 12px) 8px 12px max(8px,env(safe-area-inset-left));border-right:1px solid var(--line);background:var(--card)}
  .rail .brand b{display:none}.rail .brand{justify-content:center}
  main{padding-bottom:24px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right))}
  .toast{bottom:28px}
  .sheet{align-items:center}.sheetbox{border-radius:24px}
}
/* desktop: both directions side by side, like a conversation */
@media (min-width:1100px){
  :root{--rail:220px}
  .rail .brand b{display:inline}.rail .brand{justify-content:flex-start}
  .rail .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:.95rem}
  .tgrid:not(.brl){grid-template-columns:1.1fr 1fr}
  .tgrid:not(.brl) .pane.s2t,.tgrid:not(.brl) .pane.t2s{display:block}
  .tgrid.brl .pane.brl{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}.tgrid.brl .chart{grid-column:1/-1;margin:0}
  .cam{max-height:62dvh}
  .avatar{height:min(56dvh,520px)}
}
/* phones held sideways: camera beside the text */
@media (orientation:landscape) and (max-height:540px){
  .bar{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;width:72px;flex:none;padding:8px 6px 8px max(6px,env(safe-area-inset-left));background:var(--card);border-right:1px solid var(--line)}
  .rail .brand{display:none}.rail .tab{font-size:.62rem;min-height:44px;flex:1}
  main{padding:8px max(12px,env(safe-area-inset-right)) 12px 12px}
  .top{margin:0 0 8px}h1{font-size:1.15rem}
  .pane.s2t{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;align-items:start}
  .tgrid.t2s .pane.t2s{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
  .pane.s2t .chips{grid-column:2;margin:0}.pane.s2t .cam{grid-row:span 2;max-height:calc(100dvh - 70px)}
  .avatar{height:calc(100dvh - 90px)}
  .caption{font-size:1.25rem}
}
/* big screens and TVs */
@media (min-width:1700px){:root{font-size:calc(var(--fs) * 1.15)}}
@media (min-width:2400px){:root{font-size:calc(var(--fs) * 1.45)}}
@media (hover:hover){.chips button:hover,.unit:hover,.witem:hover,.ib:hover{filter:brightness(.97)}.primary:hover{background:var(--pri2)}}
@media (pointer:coarse){.ib{width:48px;height:48px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:root.rm *{animation:none!important;transition:none!important}
@media print{.bar,.rail,.cam,.stage{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<template id="privacyTpl"><h2>Privacy policy and cookies</h2>
<p class="muted">Effective 3 November 2026 · applies to the SENYAS website, the SENYAS web app and the SENYAS Android app.</p>
<p><b>In short:</b> SENYAS reads your hands on your own device. Camera video is never uploaded, recorded or shared. SENYAS has no accounts, no ads and no tracking.</p>
<h3>1. Camera and photos</h3>
<p>When you press <i>Start camera</i>, video is passed to the hand-tracking model running inside your browser or the app. Only the positions of your hand joints are used, in memory, and are thrown away moments later. No picture or video leaves your device. You can stop the camera at any time; it also stops when you leave the screen.</p>
<p>Braille photos you upload, and braille seen by the live scanner, are read on your device in the same way. The picture is not uploaded or kept; only the text you choose to keep appears in your conversation history.</p>
<h3>2. Microphone and voice</h3>
<p>The microphone is used only while you hold the microphone button, to turn speech into text for the avatar. Speech recognition is provided by your browser or phone (for example Google or Apple), which may process the audio on their servers under their own privacy policies. Reading aloud uses the voices installed on your device.</p>
<h3>3. What is saved on your device</h3>
<p>If you allow it, SENYAS saves your settings, lesson progress, conversation history, the signs you teach it and your personal examples in your device's local storage (similar to cookies). This stays on your device. You can export it, or delete it any time in <i>Settings → Privacy &amp; data</i>. If you choose <i>Essential only</i>, nothing but that choice is saved and everything resets when you close the app.</p>
<h3>4. Cookies</h3>
<ul>
<li><b>senyas_consent</b> (essential, website): remembers your cookie choice for 12 months.</li>
<li><b>senyas_lang</b> (preference, website, only if you accept): remembers the website language for 12 months.</li>
<li><b>senyas.*</b> local storage (app): see section 3.</li>
</ul>
<p>SENYAS uses no advertising, analytics or third-party tracking cookies.</p>
<h3>5. Downloads and hosting</h3>
<p>The website is served by GitHub Pages, which keeps standard server logs (such as IP address) for security. If the hand-tracking files are not already on your device, they may be downloaded from jsDelivr or Google's model storage; those services see a normal web request. After the first download, the app works offline.</p>
<h3>6. Children</h3>
<p>SENYAS is made for learners of all ages, including students. It collects no personal information, so no account or parental data is needed.</p>
<h3>7. Your rights</h3>
<p>Because SENYAS does not collect your data on any server, there is nothing about you for us to hold, sell or share. Under the Philippine Data Privacy Act of 2012 (RA 10173) you may still ask questions or raise concerns using the contact below.</p>
<h3>8. Sign language accuracy</h3>
<p>SENYAS is a learning and communication aid, not a certified interpreter. For medical, legal or emergency situations, ask for a qualified FSL interpreter.</p>
<h3>9. Changes and contact</h3>
<p>If this policy changes, the date above will change and the app will ask for your choice again where needed. Contact: open an issue on the SENYAS project page on GitHub.</p>

<script>/* SENYAS hand: a 3D hand built from joint angles. It draws the signing avatar and makes the
   built-in examples the live translator compares camera hands against.
   Space: x to the viewer's right, y up, z toward the viewer. Hands are built as a right hand;
   a left hand is the mirror image (x -> -x). Points follow the MediaPipe order (0 wrist,
   1-4 thumb, 5-8 index, 9-12 middle, 13-16 ring, 17-20 pinky). */
var Hand = (function () {
  var RAD = Math.PI / 180;
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function len(a) { return Math.sqrt(dot(a, a)); }
  function norm(a) { var l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  function mix(a, b, t) { return a + (b - a) * t; }
  function mixV(a, b, t) { return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)]; }
  function avg(a, b) { return mixV(a, b, 0.5); }

  var MCP = [[0.30, 0.95, 0], [0.08, 1.0, 0], [-0.13, 0.95, 0], [-0.32, 0.85, 0]];
  var SEG = [[0.45, 0.27, 0.22], [0.50, 0.31, 0.23], [0.47, 0.29, 0.22], [0.36, 0.21, 0.19]];
  var BASE = [5, 0, -5, -10];
  var CMC = [0.21, 0.2, 0.08], TH = [0.42, 0.33, 0.27];
  var CURL = {
    x: [0, 0, 0], c: [88, 100, 65], h: [8, 95, 75], b: [85, 5, 5], r: [28, 45, 30], o: [45, 65, 40],
    e: [62, 105, 72], m: [72, 85, 40], k: [45, 0, 0], f: [55, 22, 12], s: [12, 18, 10], t: [70, 95, 55], w: [25, 20, 12]
  };

  /* ---------- braille: photo or live camera -> text ---------- */
  function makeBraille() {
    var B = { on: false, stream: null, timer: 0, last: "", same: 0, said: "", text: "" }, v = $("#bvideo"), ov = $("#boverlay"), img = $("#bimg");
    function st(s) { $("#bStatus").textContent = s || ""; }
    function drawMarks(res, w, h) {
      ov.width = w; ov.height = h;
      var c = ov.getContext("2d"); c.clearRect(0, 0, w, h);
      if (!res) return;
      c.lineWidth = Math.max(2, w / 400);
      res.boxes.forEach(function (b) { c.save(); c.translate(b.x, b.y); c.rotate(b.ang || 0); c.strokeStyle = "rgba(242,169,0,.9)"; c.strokeRect(0, 0, b.w, b.h); c.restore(); });
      c.fillStyle = "rgba(91,155,255,.85)";
      res.dots.forEach(function (d) { c.beginPath(); c.arc(d.x, d.y, Math.max(3, d.r), 0, 7); c.fill(); });
    }
    function show(res, live) {
      if (!res || !res.cells || res.conf < 0.5) {
        if (!live) { $("#bText").innerHTML = '<span class="ph">' + esc(t("bNone")) + "</span>"; $("#bCells").textContent = ""; $("#bTrans").textContent = ""; $("#bInfo").textContent = ""; }
        return;
      }
      B.text = res.text;
      $("#bCells").textContent = res.braille;
      $("#bText").textContent = res.text;
      $("#bInfo").textContent = res.cells + " " + t("bCellsN") + " · " + Math.round(res.conf * 100) + "%";
      var w = DATA.find(res.text), tr = w ? wordText(w, S.out) : DATA.toSigns(res.text).filter(function (x) { return x.word; }).map(function (x) { return wordText(x.word, S.out); }).join(" ");
      $("#bTrans").textContent = tr && DATA.key(tr) !== DATA.key(res.text) ? "→ " + tr : "";
      if (S.aloud && res.text !== B.said) { B.said = res.text; say(res.text, S.out, true); }
    }
    B.file = function (f) {
      if (!f) return;
      B.stop();
      var url = URL.createObjectURL(f);
      img.onload = function () {
        img.hidden = false; $("#bcam").classList.add("live"); $("#bstart").hidden = true;
        var res = Braille.scan(img, 1400);
        drawMarks(res, img.naturalWidth, img.naturalHeight); show(res, false);
        if (res && res.text && res.conf >= 0.5) addHist("si", "⠃ " + res.text);
      };
      img.src = url;
    };
    B.start = async function () {
      if (B.on) return;
      try { B.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } }); }
      catch (e) { toast(t("camError")); return; }
      img.hidden = true; v.srcObject = B.stream; try { await v.play(); } catch (e) {}
      B.on = true; $("#bcam").classList.add("live"); $("#bstart").hidden = true; st("⠃ " + t("reading"));
      B.timer = setInterval(function () {
        if (v.readyState < 2) return;
        var res = Braille.scan(v, 960);
        drawMarks(res, v.videoWidth, v.videoHeight);
        if (res && res.cells && res.conf >= 0.6) {
          if (res.text === B.last) B.same++; else { B.same = 0; B.last = res.text; }
          if (B.same >= 1) show(res, true);
        }
      }, 650);
    };
    B.stop = function () {
      clearInterval(B.timer);
      var was = B.on || !img.hidden; B.on = false;
      if (B.stream) B.stream.getTracks().forEach(function (tr) { tr.stop(); }); B.stream = null; v.srcObject = null; st("");
      if (was) { ov.getContext("2d").clearRect(0, 0, ov.width, ov.height); img.hidden = true; $("#bcam").classList.remove("live"); $("#bstart").hidden = false; }
    };
    $("#bLive").onclick = function () { B.start(); };
    $("#bStop").onclick = function () { B.stop(); };
    $("#bFile").onchange = function () { B.file(this.files[0]); this.value = ""; };
    $("#bAloud").onchange = function () { S.aloud = this.checked; $("#aloud").checked = S.aloud; saveS(); };
    $("#bSpeak").onclick = function () { if (B.text) say(B.text, S.out, true); };
    $("#bCopy").onclick = function () { if (B.text && navigator.clipboard) navigator.clipboard.writeText(B.text).then(function () { toast(t("copied")); }); };
    $("#bSign").onclick = function () { if (!B.text) return; setDir("t2s"); $("#askText").value = B.text; signText(B.text); };
    $("#bChart").innerHTML = "abcdefghijklmnñopqrstuvwxyz".split("").map(function (c) { return "<span><i>" + Braille.write(c) + "</i>" + c.toUpperCase() + "</span>"; }).join("") +
      "<span><i>" + Braille.cellChar(60) + "</i>#</span><span><i>" + Braille.cellChar(32) + "</i>Aa</span>";
    return B;

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

      var el = openSheet('<h2>' + esc(t("gFlash")) + ' <small class="muted">' + (i + 1) + "/" + deck.length + '</small></h2><div class="lesson"><canvas class="avatar" id="fav"></canvas><div id="fans" hidden><div class="wordbig">' + esc(wordText(w)) + "</div>" + trio(w) + '</div><div class="navrow"><button class="ghost" id="frev">' + esc(t("reveal")) + '</button><button class="ghost" id="fag">' + esc(t("again")) + '</button><button class="primary" id="fknew">' + esc(t("knew")) + "</button></div></div>");
      var pl = new Avatar.Player($("#fav", el), { tone: S.tone, lefty: S.hand === "left" }); setTimeout(function () { pl.play([{ spec: w.spec, face: w.face, hold: 600 }]); }, 150);
      bindTrio(el, w);
      $("#frev", el).onclick = function () { $("#fans", el).hidden = false; };
      $("#fag", el).onclick = function () { P.flash[w.id] = Math.max(0, (P.flash[w.id] || 0) - 1); saveP(); deck.push(w); i++; card(); };
      $("#fknew", el).onclick = function () { P.flash[w.id] = (P.flash[w.id] || 0) + 1; addXP(3); i++; card(); };
    }
    card();
  };

  /* ---------- dictionary ---------- */
  var dictCat = "all";
  function renderDict() {
    var cats = ["all", "abc", "num"].concat(DATA.CATS);
    $("#cats").innerHTML = cats.map(function (c) { return '<button data-c="' + c + '" class="' + (c === dictCat ? "on" : "") + '">' + esc(c === "all" ? t("all") : c === "abc" ? t("alphabet") : c === "num" ? t("numbers") : t("cat_" + c)) + "</button>"; }).join("");
    $$("#cats button").forEach(function (b) { b.onclick = function () { dictCat = b.dataset.c; renderDict(); }; });
    var q = DATA.key($("#q").value || "");
    var showLetters = (dictCat === "all" && !q) || dictCat === "abc";
    var L = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("").concat(["NG"]);
    $("#letters").innerHTML = showLetters ? L.map(function (l) { return '<button data-l="' + l + '"><canvas></canvas>' + l + "</button>"; }).join("") : "";
    $$("#letters button").forEach(function (b) {
      var it = itemOf("l:" + b.dataset.l); Avatar.still($("canvas", b), it.spec.split(" ")[0], { tone: S.tone, crop: "hand" });
      b.onclick = function () { detail(it); };
    });
    var list = DATA.list.filter(function (w) {
      if (dictCat === "abc") return false;
      if (dictCat === "num") { if (!w.num && w.num !== 0) return false; } else if (dictCat !== "all" && w.cat !== dictCat) return false;
      return !q || [w.en, w.fil, w.bcl].some(function (s) { return DATA.key(s).indexOf(q) >= 0; });
    });
    $("#wlist").innerHTML = list.map(function (w) {
      return '<button class="witem" data-id="' + w.id + '"><canvas></canvas><span><b>' + esc(wordText(w)) + (DATA.LIVE.indexOf(w.id) >= 0 || w.num !== undefined ? '<span class="live">LIVE</span>' : "") + "</b><small>" +
        esc(["en", "fil", "bcl"].filter(function (l) { return l !== S.ui; }).map(function (l) { return first(w[l]); }).join(" · ")) + "</small></span></button>";
    }).join("");
    $$("#wlist .witem").forEach(function (b) {
      var w = DATA.words[b.dataset.id]; Avatar.still($("canvas", b), w.spec, { tone: S.tone });
      b.onclick = function () { detail(itemOf(w.num !== undefined ? "n:" + w.num : "w:" + w.id)); };
    });
  }
  $("#q").addEventListener("input", function () { if (dictCat === "abc") dictCat = "all"; renderDict(); });
  function detail(it) {
    var el = openSheet("<h2>" + esc(it.label) + '</h2><div class="lesson"><canvas class="avatar" id="dav"></canvas>' + trio(it.w) + (it.w && it.w.desc ? '<p class="muted">' + esc(it.w.desc) + "</p>" : "") +
      '<div class="navrow"><button class="ib" id="dr"><svg><use href="#i-redo"/></svg></button>' + (it.tok ? '<button class="pill" id="dc"><svg><use href="#i-cam"/></svg>' + esc(t("practice")) + "</button>" : "") +
      (it.w ? '<button class="primary" id="du"><svg><use href="#i-hand"/></svg>' + esc(t("tabTranslate")) + "</button>" : "") + "</div></div>");
    var pl = new Avatar.Player($("#dav", el), { tone: S.tone, lefty: S.hand === "left" }), play = function () { pl.play([{ spec: it.spec, face: it.face, hold: 700 }]); };
    setTimeout(play, 150); $("#dr", el).onclick = play; if (it.w) bindTrio(el, it.w);
    if (!P.learned[it.key]) { P.learned[it.key] = 1; addXP(2); }
    if ($("#dc", el)) $("#dc", el).onclick = function () { practice([it], 0); };
    if ($("#du", el)) $("#du", el).onclick = function () { closeSheet(); go("translate"); setDir("t2s"); var s = first(it.w[S.inLang]); $("#askText").value = s; signText(s); };
  }

  /* ---------- phrasebook ---------- */
  function renderPhrases() {
    var order = [S.ui].concat(["en", "fil", "bcl"].filter(function (l) { return l !== S.ui; })), NAME = { en: "EN", fil: "FIL", bcl: "BIK" };
    $("#plist").innerHTML = DATA.phrases.map(function (p, i) {
      return '<div class="pitem">' + order.map(function (l, n) { return '<button style="text-align:left" data-say="' + l + '" data-i="' + i + '"><span class="l">' + NAME[l] + "</span>" + (n ? esc(p[l]) : "<b>" + esc(p[l]) + "</b>") + "</button>"; }).join("") +
        '<div class="acts"><button class="pill" data-sign="' + i + '"><svg><use href="#i-hand"/></svg>' + esc(t("signIt")) + '</button><button class="ib" data-cp="' + i + '" aria-label="' + esc(t("copy")) + '"><svg><use href="#i-copy"/></svg></button></div></div>';
    }).join("");
    $$("#plist [data-say]").forEach(function (b) { b.onclick = function () { say(DATA.phrases[+b.dataset.i][b.dataset.say], b.dataset.say, true); }; });
    $$("#plist [data-sign]").forEach(function (b) { b.onclick = function () { var p = DATA.phrases[+b.dataset.sign]; go("translate"); setDir("t2s"); $("#askText").value = p[S.inLang]; signText(p[S.inLang]); }; });
    $$("#plist [data-cp]").forEach(function (b) { b.onclick = function () { var p = DATA.phrases[+b.dataset.cp]; if (navigator.clipboard) navigator.clipboard.writeText(p[S.ui]).then(function () { toast(t("copied")); }); }; });
  }

  /* ---------- teach a sign ---------- */
  $("#tTeach").onclick = function () { teach(); };
  function teach() {
    var takes = [], opts = DATA.list.map(function (w) { return '<option value="' + esc(wordText(w)) + '">'; }).join("");
    var el = openSheet('<h2>' + esc(t("tTitle")) + '</h2><div id="pcam"></div><div class="form"><p class="muted small">' + esc(t("tPickD")) + '</p><label>' + esc(t("word")) + '<input id="tw" list="twl" autocomplete="off"><datalist id="twl">' + opts + "</datalist></label>" +
      '<details><summary class="muted">' + esc(t("newWord")) + '</summary><label>English<input id="ten"></label><label>Filipino<input id="tfil"></label><label>Bikol<input id="tbcl"></label></details>' +
      "<b>" + esc(t("tRec")) + '</b><p class="muted small">' + esc(t("tRecD")) + '</p><div class="takes"><span></span><span></span><span></span></div><div class="count" id="tcount"></div>' +
      '<div class="navrow"><button class="ghost" id="trec"><svg><use href="#i-cam"/></svg>' + esc(t("record")) + '</button><button class="primary" id="tsave" disabled>' + esc(t("save")) + "</button></div></div>");
    Cam.mount($("#pcam", el)); if (!Cam.on) Cam.start();
    function paint(rec) { $$(".takes span", el).forEach(function (s, i) { s.className = i < takes.length ? "ok" : i === takes.length && rec ? "rec" : ""; }); $("#tsave", el).disabled = takes.length < 3; }
    $("#trec", el).onclick = function () {
      if (!Cam.on) return toast(t("camFirst"));
      if (takes.length >= 3) takes = [];
      var n = 3, b = this; b.disabled = true;
      (function tick() {
        if (n > 0) { $("#tcount", el).textContent = n--; setTimeout(tick, 650); return; }
        $("#tcount", el).textContent = "●"; paint(true);
        Cam.sess.record(1500, function (r) {
          $("#tcount", el).textContent = ""; b.disabled = false;
          if (!r) { toast(t("tNoHand")); paint(); return; }
          takes.push(r); paint();
        });
      })();
    };
    $("#tsave", el).onclick = function () {
      var w = DATA.find($("#tw", el).value || ""), lab = { en: $("#ten", el).value.trim(), fil: $("#tfil", el).value.trim(), bcl: $("#tbcl", el).value.trim() };
      if (!w && !lab.en && !lab.fil && !lab.bcl) { lab.en = ($("#tw", el).value || "").trim(); if (!lab.en) { $("#tw", el).focus(); return; } }
      var moving = takes.filter(function (x) { return x.moving; }).length >= 2;
      var c = { id: Date.now().toString(36), word: w ? w.id : null, label: w ? { en: first(w.en), fil: first(w.fil), bcl: first(w.bcl) } : lab, means: takes.map(function (x) { return x.mean; }) };
      if (moving) c.dyn = takes.map(function (x) { return x.seq; });
      CUSTOM.push(c); save("custom", CUSTOM); Cam.refresh(); toast(t("tSaved")); closeSheet();
    };
  }

  /* ---------- settings ---------- */
  var installEvt = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); installEvt = e; });
  function sel(id, val, opts) { return '<select id="' + id + '">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (String(o[0]) === String(val) ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select>"; }
  function sw(id, on) { return '<label class="switch"><input type="checkbox" id="' + id + '"' + (on ? " checked" : "") + '><span class="knob"></span></label>'; }
  function row(label, ctl, sub) { return '<div class="set"><span>' + esc(label) + (sub ? "<small>" + esc(sub) + "</small>" : "") + "</span>" + ctl + "</div>"; }
  var LANGS = [["en", "English"], ["fil", "Filipino"], ["bcl", "Bikol"]];
  function renderSettings() {
    var mine = CUSTOM.map(function (c) { return row(c.label[S.ui] || c.label.en || c.label.fil || c.label.bcl, '<button class="link" data-del="' + c.id + '">' + esc(t("delete")) + "</button>", c.dyn ? "↝" : "✋"); }).join("") || '<p class="muted">' + esc(t("none")) + "</p>";
    $("#sets").innerHTML =
      '<div class="card group"><h3>' + esc(t("sUi")) + "</h3>" + row(t("sUi"), sel("sUi", S.ui, LANGS)) + row(t("sOut"), sel("sOut", S.out, LANGS)) + "</div>" +
      '<div class="card group"><h3>' + esc(t("sVoice")) + "</h3>" + row(t("sAloud"), sw("sAloud", S.aloud), t("sAloudD")) + row(t("sLetters"), sw("sLetters", S.letters)) +
      row(t("sRate"), '<input type="range" id="sRate" min="0.6" max="1.4" step="0.1" value="' + S.rate + '">') + "</div>" +
      '<div class="card group"><h3>' + esc(t("sRecog")) + "</h3>" + row(t("sHand"), sel("sHand", S.hand, [["right", t("right")], ["left", t("left")]])) + row(t("sFacing"), sel("sFacing", S.facing, [["user", t("front")], ["environment", t("back")]])) +
      row(t("sMirror"), sw("sMirror", S.mirror)) + row(t("sPoints"), sw("sPoints", S.points)) + row(t("sHold"), sel("sHold", S.hold, [[300, t("fast")], [400, t("normal")], [600, t("slow")]])) +
      row(t("sRepeat"), sw("sRepeat", S.repeat)) + row(t("sSwap"), sw("sSwap", S.swap)) + "</div>" +
      '<div class="card group"><h3>' + esc(t("sAvatar")) + "</h3>" + row(t("sTone"), '<div class="tones">' + Hand.TONES.map(function (c, i) { return '<button data-tone="' + i + '" class="' + (i === S.tone ? "on" : "") + '" style="background:' + c[0] + '" aria-label="' + (i + 1) + '"></button>'; }).join("") + "</div>") + "</div>" +
      '<div class="card group"><h3>' + esc(t("sDisplay")) + "</h3>" + row(t("sTheme"), sel("sTheme", S.theme, [["auto", t("auto")], ["light", t("light")], ["dark", t("dark")]])) +
      row(t("sText"), sel("sFs", S.fs, [[14, "A−"], [16, "A"], [18, "A+"], [21, "A++"]])) + row(t("sContrast"), sw("sHc", S.hc)) + row(t("sMotion"), sw("sRm", S.rm)) + "</div>" +
      '<div class="card group"><h3>' + esc(t("sMine")) + "</h3><p class=\"muted small\">" + esc(t("sMineD")) + "</p>" + mine + row(t("personal"), "<b>" + PERSONAL.length + "</b>") +
      '<div class="set"><button class="pill" id="sTeach"><svg><use href="#i-plus"/></svg>' + esc(t("teachSign")) + "</button></div></div>" +
      '<div class="card group"><h3>' + esc(t("sData")) + "</h3>" + row(t("privacy"), '<button class="link" id="sPriv">›</button>') + row(t("cookies"), '<button class="link" id="sCk">›</button>') +
      row(t("export"), '<button class="link" id="sExp"><svg><use href="#i-dl"/></svg></button>') + row(t("import"), '<label class="link" style="cursor:pointer">…<input type="file" id="sImp" accept="application/json" hidden></label>') +
      row(t("reset"), '<button class="link" id="sReset">↺</button>') + row(t("wipe"), '<button class="link" id="sWipe" style="color:var(--bad)">✕</button>') + "</div>" +
      '<div class="card group"><h3>' + esc(t("about")) + '</h3><p class="small">' + esc(t("aboutText")) + "</p>" + row(t("version"), "<span>" + VERSION + "</span>") +
      (installEvt && !INAPP ? row(t("install"), '<button class="pill" id="sInst"><svg><use href="#i-dl"/></svg>' + esc(t("install")) + "</button>") : "") +
      '<p class="muted small">Hand tracking: MediaPipe (Apache-2.0). <a href="' + (INAPP ? "https://pogi6969.github.io/SENYAS/" : "../") + '" target="_blank" rel="noopener">SENYAS website</a></p></div>';
    var on = function (id, ev, f) { var e = $("#" + id); if (e) e.addEventListener(ev, f); };
    on("sUi", "change", function () { S.ui = this.value; saveS(); applyText(); renderQuick(); renderSettings(); });
    on("sOut", "change", function () { S.out = this.value; $("#outLang").value = S.out; saveS(); renderCaption(); });
    on("sAloud", "change", function () { S.aloud = this.checked; $("#aloud").checked = S.aloud; $("#bAloud").checked = S.aloud; saveS(); });
    on("sLetters", "change", function () { S.letters = this.checked; saveS(); });
    on("sRate", "change", function () { S.rate = +this.value; saveS(); say(t("readAloud"), S.ui, true); });
    on("sHand", "change", function () { S.hand = this.value; saveS(); player.opts.lefty = S.hand === "left"; player.redraw(); Cam.refresh(); });
    on("sFacing", "change", function () { S.facing = this.value; saveS(); if (Cam.on) { Cam.stop(); Cam.start(); } Cam.refresh(); });
    ["Mirror", "Points", "Repeat", "Swap", "Hc", "Rm"].forEach(function (k) { on("s" + k, "change", function () { S[k.toLowerCase()] = this.checked; saveS(); Cam.refresh(); applyLook(); }); });
    on("sHold", "change", function () { S.hold = +this.value; saveS(); Cam.refresh(); });
    on("sTheme", "change", function () { S.theme = this.value; saveS(); applyLook(); });
    on("sFs", "change", function () { S.fs = +this.value; saveS(); applyLook(); });
    $$("[data-tone]").forEach(function (b) { b.onclick = function () { S.tone = +b.dataset.tone; player.opts.tone = S.tone; saveS(); player.redraw(); renderSettings(); }; });
    $$("[data-del]").forEach(function (b) { b.onclick = function () { if (!confirm(t("sure"))) return; CUSTOM = CUSTOM.filter(function (c) { return c.id !== b.dataset.del; }); save("custom", CUSTOM); Cam.refresh(); renderSettings(); }; });
    on("sTeach", "click", function () { go("translate"); setDir("s2t"); teach(); });
    on("sPriv", "click", showPrivacy); on("sCk", "click", function () { consentSheet(true); });
    on("sExp", "click", function () {
      var blob = new Blob([JSON.stringify({ app: "SENYAS", v: VERSION, settings: S, progress: P, custom: CUSTOM, personal: PERSONAL, history: HIST }, null, 1)], { type: "application/json" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "senyas-data.json"; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    });
    on("sImp", "change", function () {
      var f = this.files[0]; if (!f) return;
      f.text().then(function (s) {
        var d = JSON.parse(s); if (d.app !== "SENYAS") return;
        Object.assign(S, d.settings || {}); P = Object.assign(P, d.progress || {}); CUSTOM = d.custom || CUSTOM; PERSONAL = d.personal || PERSONAL; HIST = d.history || HIST;
        saveS(); saveP(); save("custom", CUSTOM); save("personal", PERSONAL); save("history", HIST); Cam.refresh(); applyLook(); applyText(); renderSettings(); renderHist(); toast(t("saved"));
      }).catch(function () {});
    });
    on("sReset", "click", function () { if (!confirm(t("sure"))) return; P = { xp: 0, days: [], learned: {}, quiz: {}, cam: {}, flash: {} }; saveP(); toast("✓"); });
    on("sWipe", "click", function () {
      if (!confirm(t("sure"))) return;
      try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf("senyas.") === 0) localStorage.removeItem(k); }); } catch (e) {}
      location.reload();
    });
    on("sInst", "click", function () { if (installEvt) { installEvt.prompt(); installEvt = null; renderSettings(); } });
  }

  /* ---------- privacy and cookies ---------- */
  function showPrivacy() { openSheet('<div class="policy">' + $("#privacyTpl").innerHTML + "</div>"); }
  function consentSheet(again) {
    var el = openSheet('<h2><svg><use href="#i-shield"/></svg> ' + esc(t("cTitle")) + "</h2><p>" + esc(t("cText")) + "</p>" +
      row(t("cEssential"), sw("cEss", true)) + row(t("cFunctional"), sw("cFun", again ? canStore() : true)) +
      '<p><button class="link" id="cPol">' + esc(t("privacy")) + '</button></p><div class="navrow"><button class="ghost" id="cMin">' + esc(t("cEssentialOnly")) + '</button><button class="ghost" id="cSv">' + esc(t("cSave")) + '</button><button class="primary" id="cAll">' + esc(t("cAccept")) + "</button></div>");
    $("#cEss", el).disabled = true;
    $("#cPol", el).onclick = showPrivacy;
    $("#cMin", el).onclick = function () { setConsent(false); closeSheet(); };
    $("#cSv", el).onclick = function () { setConsent($("#cFun", el).checked); closeSheet(); };
    $("#cAll", el).onclick = function () { setConsent(true); saveS(); saveP(); closeSheet(); };
  }

  /* ---------- start ---------- */
  BR = makeBraille();
  applyLook(); applyText();
  $("#aloud").checked = S.aloud; $("#bAloud").checked = S.aloud; $("#outLang").value = S.out; $("#inLang").value = S.inLang; $("#aSpeed").value = String(S.speed);
  $$("#modes button").forEach(function (x) { x.classList.toggle("on", x.dataset.mode === S.mode); }); Cam.sess.mode = S.mode;
  player.opts.lefty = S.hand === "left";
  renderCaption(); renderHist(); renderQuick();
  go((location.hash || "#translate").slice(1));
  if (!consent) setTimeout(function () { consentSheet(false); }, 400);
  if (synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = function () {};
  matchMedia("(prefers-color-scheme: dark)").addEventListener && matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyLook);
  if ("serviceWorker" in navigator && !INAPP && /^https:|^http:\/\/localhost/.test(location.href)) navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
  var cn = navigator.connection;
  if (!(cn && (cn.saveData || /2g/.test(cn.effectiveType || "")))) { if ("requestIdleCallback" in window) requestIdleCallback(function () { Cam.preload(); }); else setTimeout(Cam.preload, 2000); }
  window.SENYAS = { version: VERSION, signText: signText, onToken: onToken, go: go };
})();
</script>
</body>
