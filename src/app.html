<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENYAS</title>
<meta name="description" content="Live sign language translator and sign language lessons in English, Filipino and Bikol.">
<meta name="theme-color" content="#0E5BD8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!--CSP-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SENYAS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>/*CSS*/</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-6.5V4a1.5 1.5 0 0 1 3 0v7m0-5.5a1.5 1.5 0 0 1 3 0V12m0-4.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L3.3 16a1.6 1.6 0 0 1 2.4-2l2.3 2"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v16M8 7h7"/></symbol>
  <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5M22 9v6"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-spk" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4zM9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2M14 9v2h-2M10 17v-2h2"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7zM12 9l6 6M18 9l-6 6"/></symbol>
  <symbol id="i-space" viewBox="0 0 24 24"><path d="M3 10v4h18v-4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h14l-4-4M20 16H6l4 4"/></symbol>
  <symbol id="i-enter" viewBox="0 0 24 24"><path d="M20 5v7H5M9 8l-4 4 4 4"/></symbol>
  <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8a7 7 0 0 0 7 7z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></symbol>
  <symbol id="i-brl" viewBox="0 0 24 24"><circle cx="8" cy="5" r="1.8" fill="currentColor"/><circle cx="8" cy="12" r="1.8" fill="currentColor"/><circle cx="16" cy="5" r="1.8" fill="currentColor"/><circle cx="16" cy="19" r="1.8" fill="currentColor"/><circle cx="8" cy="19" r="1.8"/><circle cx="16" cy="12" r="1.8"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
</svg>

<div id="app">
  <nav class="rail" aria-label="Main">
    <div class="brand"><span class="logo" aria-hidden="true"></span><b>SENYAS</b></div>
    <button class="tab" data-go="translate"><svg><use href="#i-hand"/></svg><span data-t="tabTranslate"></span></button>
    <button class="tab" data-go="learn"><svg><use href="#i-cap"/></svg><span data-t="tabLearn"></span></button>
    <button class="tab" data-go="dict"><svg><use href="#i-book"/></svg><span data-t="tabDict"></span></button>
    <button class="tab" data-go="phrases"><svg><use href="#i-chat"/></svg><span data-t="tabPhrases"></span></button>
    <button class="tab" data-go="settings"><svg><use href="#i-gear"/></svg><span data-t="tabSettings"></span></button>
  </nav>

  <main>
    <!-- TRANSLATE -->
    <section id="v-translate" class="view">
      <header class="top">
        <h1 data-t="tabTranslate"></h1>
        <div class="seg" id="dir" role="tablist">
          <button data-dir="s2t" class="on"><svg><use href="#i-hand"/></svg><span data-t="signToText"></span></button>
          <button data-dir="t2s"><svg><use href="#i-chat"/></svg><span data-t="textToSign"></span></button>
          <button data-dir="brl"><svg><use href="#i-brl"/></svg><span>Braille</span></button>
        </div>
      </header>
      <div class="tgrid">
        <div class="pane s2t">
          <div class="cam" id="cam">
            <video id="video" playsinline muted autoplay></video>
            <canvas id="overlay"></canvas>
            <div class="camstart" id="camstart">
              <button class="big primary" id="startCam"><svg><use href="#i-cam"/></svg><span data-t="startCamera"></span></button>
              <p class="muted small" data-t="camPrivacy"></p>
            </div>
            <div class="status" id="camStatus"></div>
            <div class="badge" id="badge" hidden><b id="badgeTxt"></b><i id="badgeBar"></i></div>
            <div class="camtools">
              <button class="ib glass" id="flipCam" data-tt="flip"><svg><use href="#i-flip"/></svg></button>
              <button class="ib glass" id="stopCam" data-tt="stopCamera"><svg><use href="#i-x"/></svg></button>
            </div>
          </div>
          <div class="chips" id="modes">
            <button data-mode="all" class="on" data-t="modeAll"></button>
            <button data-mode="abc">ABC</button>
            <button data-mode="num">123</button>
            <button data-mode="word" data-t="modeWords"></button>
          </div>
          <div class="out card">
            <div class="outhead">
              <label class="switch" id="aloudWrap"><input type="checkbox" id="aloud"><span class="knob"></span><svg><use href="#i-spk"/></svg><span data-t="readAloud"></span></label>
              <select id="outLang" aria-label="Language"><option value="en">English</option><option value="fil">Filipino</option><option value="bcl">Bikol</option></select>
            </div>
            <div class="spell" id="spell" aria-live="polite"></div>
            <div class="caption" id="caption" aria-live="polite"><span class="ph" data-t="captionHint"></span></div>
            <div class="tools">
              <button class="ib" id="tSpace" data-tt="space"><svg><use href="#i-space"/></svg></button>
              <button class="ib" id="tBack" data-tt="backspace"><svg><use href="#i-back"/></svg></button>
              <button class="ib" id="tEnter" data-tt="newLine"><svg><use href="#i-enter"/></svg></button>
              <button class="ib" id="tSpeak" data-tt="speak"><svg><use href="#i-spk"/></svg></button>
              <button class="ib" id="tCopy" data-tt="copy"><svg><use href="#i-copy"/></svg></button>
              <button class="ib" id="tShare" data-tt="share"><svg><use href="#i-share"/></svg></button>
              <button class="ib" id="tClear" data-tt="clear"><svg><use href="#i-trash"/></svg></button>
              <button class="pill" id="tTeach"><svg><use href="#i-plus"/></svg><span data-t="teachSign"></span></button>
            </div>
          </div>
        </div>

        <div class="pane t2s">
          <div class="stage card"><canvas id="avatar" class="avatar"></canvas>
            <div class="nowsign" id="nowSign"></div>
            <div class="stagectl">
              <button class="ib glass" id="aPlay" data-tt="play"><svg><use href="#i-play"/></svg></button>
              <button class="ib glass" id="aReplay" data-tt="replay"><svg><use href="#i-redo"/></svg></button>
              <select id="aSpeed" aria-label="Speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.3">1.3×</option></select>
            </div>
          </div>
          <div class="chips gloss" id="gloss"></div>
          <div class="brlline" id="t2sBrl" aria-label="Braille"></div>
          <form class="ask card" id="askForm">
            <textarea id="askText" rows="2" data-ph="typeHere" maxlength="600"></textarea>
            <div class="askrow">
              <select id="inLang" aria-label="Language"><option value="en">English</option><option value="fil">Filipino</option><option value="bcl">Bikol</option></select>
              <button type="button" class="ib" id="mic" data-tt="speakNow"><svg><use href="#i-mic"/></svg></button>
              <button class="primary" type="submit"><svg><use href="#i-hand"/></svg><span data-t="signIt"></span></button>
            </div>
          </form>
          <div class="chips scroll" id="quick"></div>
        </div>
        <div class="pane brl">
          <div class="cam" id="bcam">
            <video id="bvideo" playsinline muted autoplay></video>
            <img id="bimg" alt="" hidden>
            <canvas id="boverlay"></canvas>
            <div class="camstart" id="bstart">
              <button class="big primary" id="bLive"><svg><use href="#i-cam"/></svg><span data-t="bLive"></span></button>
              <label class="pill" for="bFile" style="cursor:pointer"><svg><use href="#i-img"/></svg><span data-t="bUpload"></span></label>
              <input type="file" id="bFile" accept="image/*" hidden>
              <p class="muted small" data-t="bTip"></p>
            </div>
            <div class="status" id="bStatus"></div>
            <div class="camtools">
              <label class="ib glass" for="bFile" style="cursor:pointer" data-tt="bUpload"><svg><use href="#i-img"/></svg></label>
              <button class="ib glass" id="bStop" data-tt="stopCamera"><svg><use href="#i-x"/></svg></button>
            </div>
          </div>
          <div class="out card">
            <div class="outhead">
              <label class="switch"><input type="checkbox" id="bAloud"><span class="knob"></span><svg><use href="#i-spk"/></svg><span data-t="readAloud"></span></label>
              <span class="muted small" id="bInfo"></span>
            </div>
            <div class="brlline" id="bCells"></div>
            <div class="caption" id="bText"><span class="ph" data-t="bHint"></span></div>
            <div class="muted" id="bTrans"></div>
            <div class="tools">
              <button class="ib" id="bSpeak" data-tt="speak"><svg><use href="#i-spk"/></svg></button>
              <button class="ib" id="bCopy" data-tt="copy"><svg><use href="#i-copy"/></svg></button>
              <button class="pill" id="bSign"><svg><use href="#i-hand"/></svg><span data-t="signIt"></span></button>
            </div>
          </div>
          <details class="card chart"><summary data-t="bChart"></summary><div class="bchart" id="bChart"></div></details>
        </div>
      </div>
      <div class="card hist">
        <div class="row between"><h3 data-t="conversation"></h3><button class="link" id="histClear" data-t="clear"></button></div>
        <ol id="history"></ol>
      </div>
    </section>

    <!-- LEARN -->
    <section id="v-learn" class="view" hidden>
      <header class="top"><h1 data-t="tabLearn"></h1></header>
      <div class="stats card" id="stats"></div>
      <h2 data-t="units"></h2>
      <div class="units" id="units"></div>
      <h2 data-t="games"></h2>
      <div class="units">
        <button class="unit game" id="gReadSpell"><span class="uic">🔤</span><b data-t="gReadSpell"></b><small data-t="gReadSpellD"></small></button>
        <button class="unit game" id="gSpellCam"><span class="uic">✋</span><b data-t="gSpellCam"></b><small data-t="gSpellCamD"></small></button>
        <button class="unit game" id="gFlash"><span class="uic">🃏</span><b data-t="gFlash"></b><small data-t="gFlashD"></small></button>
      </div>
    </section>

    <!-- DICTIONARY -->
    <section id="v-dict" class="view" hidden>
      <header class="top"><h1 data-t="tabDict"></h1></header>
      <div class="search card"><svg><use href="#i-search"/></svg><input id="q" type="search" data-ph="searchWords" autocomplete="off"></div>
      <div class="chips scroll" id="cats"></div>
      <div class="letters" id="letters"></div>
      <div class="wlist" id="wlist"></div>
    </section>

    <!-- PHRASES -->
    <section id="v-phrases" class="view" hidden>
      <header class="top"><h1 data-t="tabPhrases"></h1></header>
      <div class="plist" id="plist"></div>
    </section>

    <!-- SETTINGS -->
    <section id="v-settings" class="view" hidden>
      <header class="top"><h1 data-t="tabSettings"></h1></header>
      <div class="sets" id="sets"></div>
    </section>
  </main>

  <nav class="bar" aria-label="Main">
    <button class="tab" data-go="translate"><svg><use href="#i-hand"/></svg><span data-t="tabTranslate"></span></button>
    <button class="tab" data-go="learn"><svg><use href="#i-cap"/></svg><span data-t="tabLearn"></span></button>
    <button class="tab" data-go="dict"><svg><use href="#i-book"/></svg><span data-t="tabDict"></span></button>
    <button class="tab" data-go="phrases"><svg><use href="#i-chat"/></svg><span data-t="tabPhrases"></span></button>
    <button class="tab" data-go="settings"><svg><use href="#i-gear"/></svg><span data-t="tabSettings"></span></button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden><div class="sheetbox" role="dialog" aria-modal="true"><button class="ib close" id="sheetX" aria-label="Close"><svg><use href="#i-x"/></svg></button><div id="sheetBody"></div></div></div>
<div class="toast" id="toast" role="status"></div>
<template id="privacyTpl"><!--PRIVACY--></template>
<script>/*JS*/</script>
</body>
</html>
