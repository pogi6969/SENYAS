name: SENYAS
options:
  bundleIdPrefix: ph.senyas
  deploymentTarget:
    iOS: "15.0"
targets:
  SENYAS:
    type: application
    platform: iOS
    sources:
      - path: SENYAS
      - path: ../../app
        type: folder
        buildPhase: resources
    info:
      path: SENYAS/Info.plist
      properties:
        CFBundleDisplayName: SENYAS
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        WKAppBoundDomains:
          - pogi6969.github.io
        NSCameraUsageDescription: SENYAS uses the camera to read sign language and braille. Video stays on this device and is never recorded or sent.
        NSMicrophoneUsageDescription: SENYAS uses the microphone only while you hold the microphone button, to turn your speech into signs.
        NSSpeechRecognitionUsageDescription: SENYAS turns your speech into text so the avatar can sign it.
        NSPhotoLibraryUsageDescription: SENYAS reads braille from a photo you choose. The photo stays on this device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ph.senyas.app
        PRODUCT_NAME: SENYAS
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
