name: Play Store app
on:
  push:
    branches: [main]
    paths: ["app/**", "icons/**", "native/android/**", ".github/workflows/store-apps.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Upload key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SENYAS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SENYAS_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          SENYAS_KEYSTORE_PASSWORD: ${{ secrets.SENYAS_KEYSTORE_PASSWORD }}
          SENYAS_KEY_ALIAS: ${{ secrets.SENYAS_KEY_ALIAS }}
          SENYAS_KEY_PASSWORD: ${{ secrets.SENYAS_KEY_PASSWORD }}
        run: |
          gradle -p native/android --no-daemon assembleDebug
          if [ -n "$SENYAS_KEYSTORE" ]; then gradle -p native/android --no-daemon assembleRelease bundleRelease; fi
          mkdir -p out
          if [ -f native/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp native/android/app/build/outputs/apk/release/app-release.apk out/SENYAS.apk
          else
            cp native/android/app/build/outputs/apk/debug/app-debug.apk out/SENYAS.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SENYAS-android
          path: |
            out/SENYAS.apk
            native/android/app/build/outputs/bundle/release/*.aab
      - name: Publish the APK for the website's download button
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: senyas-android
          name: SENYAS for Android
          make_latest: true
          body: "Install SENYAS on Android: download SENYAS.apk and open it."
          files: out/SENYAS.apk
